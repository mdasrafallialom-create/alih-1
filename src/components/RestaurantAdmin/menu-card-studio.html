<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Menu Card Studio Reference</title>
  <link rel="stylesheet" href="menu-card-studio.css">
</head>
<body class="studio-body">
  <div class="studio-layout">
    <aside class="studio-sidebar">
      <h2>Menu Card Studio</h2>
      <p>Configure your restaurant QR menu layout perfectly</p>
      
      <form class="studio-form">
        <section class="studio-section">
          <h3>Choose Template</h3>
          <div class="template-grid">
            <div class="template-option selected">
              <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=150&q=80" alt="Premium Orange">
              <p>Premium Orange</p>
            </div>
          </div>
        </section>

        <section class="studio-section">
          <h3>Restaurant Information</h3>
          <div class="form-group">
            <label>Restaurant Name</label>
            <input type="text" id="restaurantNameInput" value="Royal Flame Kitchen">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="phoneInput" value="123-456-7890">
          </div>
          <div class="form-group">
            <label>Website URL</label>
            <input type="text" id="websiteInput" value="www.yourrestaurant.com">
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" id="addressInput" value="123 Anywhere St, Any City">
          </div>
        </section>

        <section class="studio-section">
          <h3>Typography & Fonts</h3>
          <div class="fonts-list">
            <button class="font-option selected" data-font-family='"Cinzel", serif'>
              <span class="font-preview">Cinzel</span>
              <small>Luxury Serif</small>
            </button>
            <button class="font-option" data-font-family='"Oswald", sans-serif'>
              <span class="font-preview">Oswald</span>
              <small>Modern Sans</small>
            </button>
          </div>
        </section>

        <div class="studio-actions">
          <button type="button" class="btn btn-secondary">Save Draft</button>
          <button type="button" class="btn btn-primary">Publish Menu</button>
        </div>
      </form>
    </aside>

    <main class="studio-preview-pane">
      <div class="preview-header">
        <span>Live Preview</span>
      </div>
      <div class="preview-frame-container">
        <!-- Live view of template HTML -->
        <iframe src="menu-card-template.html" id="previewIFrame"></iframe>
      </div>
    </main>
  </div>
</body>
</html>
