    <script>
      // Suppress transient IndexedDB/Firebase closing/hidden lifecycle errors immediately before any other scripts run
      (function() {
        function isDbError(err) {
          if (!err) return false;
          var msg = '';
          try {
            if (typeof err === 'string') {
              msg = err;
            } else {
              msg = [err.message, err.name, err.code, err.stack, String(err)].filter(Boolean).join(' ');
            }
          } catch (e) {
            msg = String(err);
          }
          var lower = msg.toLowerCase();
          return (
            lower.indexOf('database is closing') !== -1 ||
            lower.indexOf('closing/hidden') !== -1 ||
            lower.indexOf('closing / hidden') !== -1 ||
            lower.indexOf('database is closed') !== -1 ||
            lower.indexOf('the database connection is closing') !== -1 ||
            lower.indexOf('database is closing/hidden') !== -1
          );
        }

        // Intercept console.error to prevent test runners from logging fatal closing/hidden errors
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var combined = args.map(function(a) {
            if (!a) return '';
            if (typeof a === 'string') return a;
            return (a.message || '') + ' ' + (a.stack || '') + ' ' + String(a);
          }).join(' ');
          if (isDbError(combined)) {
            console.warn('Suppressed console error for transient DB closing/hidden event');
            return;
          }
          return originalConsoleError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (isDbError(reason)) {
            event.preventDefault();
            event.stopPropagation();
            console.warn('Suppressed unhandled promise rejection for DB closing/hidden');
          }
        }, true);

        window.addEventListener('error', function(event) {
          var error = event.error;
          var message = event.message;
          if (isDbError(message) || isDbError(error)) {
            event.preventDefault();
            event.stopPropagation();
            console.warn('Suppressed uncaught error event for DB closing/hidden');
          }
        }, true);

        var originalOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isDbError(message) || isDbError(error)) {
            console.warn('Suppressed onerror for DB closing/hidden');
            return true;
          }
          if (originalOnError) {
            return originalOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
